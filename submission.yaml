submission:
  title: "CongestiQ — AI-Powered Port Congestion Prediction & Operations Optimizer"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Port operators manage berths, cranes, and yard space for hundreds of vessels,
    but congestion is often identified only after ships begin queuing. This causes
    delays and makes alternate routing and resource allocation decisions difficult
    to make in time.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    CongestiQ is an AI-powered port operations system that predicts upcoming
    congestion using vessel schedules and port capacity data. It identifies
    vessels at risk of delay, recommends alternative routing strategies,
    optimizes berth and crane assignments, and generates a prioritized 72-hour
    operations plan for port supervisors.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "AI-powered port congestion prediction"
    - "Vessel delay and congestion risk detection"
    - "Alternative routing recommendations"
    - "Berth and crane assignment optimization"
    - "AI-generated 72-hour port operations plan"

  tech_stack:
    languages: ["Python", "JavaScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite", "PostgreSQL"]                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    CongestiQ combines congestion prediction, operational optimization,
    and AI-powered decision support into one platform, helping port
    operators understand upcoming congestion and take proactive action.

  known_limitations: >                 # Optional but recommended — be honest about gaps
   The prototype uses simulated or sample port operational data and
    is intended as a decision-support system. Predictions and
    recommendations depend on the quality and availability of input data.

